<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tissue Research Notebook</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: #f8fafc; color: #0f172a; font-family: Arial, sans-serif; padding: 16px; }
    .container { max-width: 1180px; margin: 0 auto; }
    .header, .card { background: #fff; border-radius: 28px; padding: 22px; box-shadow: 0 4px 18px rgba(15,23,42,.08); }
    .header { margin-bottom: 18px; }
    .header-row { display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
    h1 { margin: 0; font-size: 28px; font-weight: 900; }
    h2 { margin: 0; font-size: 22px; font-weight: 900; }
    .muted { color: #64748b; font-size: 14px; }
    .nav { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin-bottom: 18px; }
    @media (min-width: 900px) { .nav { grid-template-columns: repeat(7, minmax(0, 1fr)); } }
    .nav-btn { border: 0; border-radius: 22px; padding: 15px 12px; font-size: 16px; font-weight: 800; cursor: pointer; box-shadow: 0 2px 10px rgba(15,23,42,.04); background: white; color: #475569; }
    .nav-btn.active { background: #0f172a; color: white; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 12px; }
    .section { display: grid; gap: 14px; }
    .btn { padding: 11px 15px; border-radius: 14px; border: 0; background: #0f172a; color: white; font-weight: 800; cursor: pointer; }
    .btn-outline { background: white; color: #0f172a; border: 1px solid #cbd5e1; }
    .btn-danger { background: #dc2626; color: white; }
    input, select, textarea { width: 100%; padding: 11px 12px; border: 1px solid #cbd5e1; border-radius: 14px; font-size: 14px; background: white; font-family: inherit; }
    textarea { min-height: 82px; }
    label { font-weight: 800; display: block; margin-bottom: 5px; }
    .toolbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .stat-value { font-size: 30px; font-weight: 900; margin-top: 4px; }
    .stat-label { color: #64748b; font-size: 13px; }
    .stat-sub { color: #94a3b8; font-size: 12px; }
    .table-wrap { overflow-x: auto; border-radius: 18px; border: 1px solid #e2e8f0; background: white; }
    table { width: 100%; min-width: 780px; border-collapse: collapse; font-size: 14px; }
    th { text-align: left; background: #f1f5f9; padding: 12px; border-bottom: 1px solid #e2e8f0; color: #475569; }
    td { padding: 10px; border-bottom: 1px solid #e2e8f0; vertical-align: top; }
    .badge { border-radius: 999px; padding: 5px 10px; font-size: 12px; font-weight: 800; display: inline-block; }
    .badge-ok { background: #dcfce7; color: #047857; }
    .badge-bad { background: #fee2e2; color: #b91c1c; }
    .badge-neutral { background: #e2e8f0; color: #334155; }
    .recent-item { padding: 12px; border-bottom: 1px solid #e2e8f0; }
    .space-top { margin-top: 10px; }
  </style>
</head>
<body>
  <div class="container">
    <header class="header">
      <div class="header-row">
        <div>
          <h1>🌱 Tissue Research Notebook</h1>
          <p class="muted" style="margin:6px 0 0">Simple sections • HTML ready • Local storage</p>
        </div>
        <div class="toolbar">
          <button class="btn" onclick="setTab('cultures')">+ New Record</button>
          <button class="btn btn-outline" onclick="exportReport()">⬇️ Export</button>
        </div>
      </div>
    </header>
    <nav class="nav" id="nav"></nav>
    <main id="app"></main>
  </div>

<script>
const STORAGE_KEY = 'tissue_research_html_final_v1';
const STATUS_OPTIONS = ['Planning', 'Running', 'Active', 'Rooting', 'Contamination', 'Browning', 'Dead', 'Closed'];
const UNIT_OPTIONS = ['g', 'ml'];
const tabs = [
  ['dashboard','📊 Dashboard'], ['projects','📘 Projects'], ['experiments','📋 Experiments'],
  ['cultures','🌿 Culture Records'], ['formulas','🧪 Formulas'], ['costs','💰 Cost Analysis'], ['reports','📄 Reports']
];
const defaultData = {
  projects: [
    { id:'P-001', name:'Low-cost Tissue Culture Medium', type:'อาหารเพาะเลี้ยงต้นทุนต่ำ', status:'Active', goal:'ลดต้นทุนอาหารเพาะเลี้ยงโดยใช้ปุ๋ย 20-20-20+TE และสารที่หาได้ง่าย', note:'โปรเจกต์หลักสำหรับทดลองสูตรอาหารต้นทุนต่ำ' },
    { id:'P-002', name:'Low-cost Filter Lid', type:'ฝาเพาะเลี้ยงแบบมี filter', status:'Active', goal:'เพิ่มการแลกเปลี่ยนก๊าซ ลดอาการฉ่ำน้ำ และลดการปนเปื้อน', note:'ใช้เปรียบเทียบภาชนะปกติกับฝา filter' }
  ],
  experiments: [
    { id:'EXP-001', projectId:'P-001', title:'เปรียบเทียบสูตร F1 กับ F2', plant:'กล้วย', formula:'F1 / F2', startDate:'2026-04-20', status:'Running', objective:'เปรียบเทียบการเจริญเติบโตและการปนเปื้อนของสูตรอาหารต้นทุนต่ำ', note:'ติดตามผลทุก 7 วัน' }
  ],
  cultures: [
    { id:'BAN-F1-001', experimentId:'EXP-001', plant:'กล้วย', formula:'F1', startDate:'2026-04-20', status:'Active', note:'ยอดเขียวดี ยังไม่พบเชื้อ' },
    { id:'BAN-F1-002', experimentId:'EXP-001', plant:'กล้วย', formula:'F1', startDate:'2026-04-20', status:'Contamination', note:'พบฝ้าขาวบริเวณผิวอาหาร' },
    { id:'LID-F1-001', experimentId:'EXP-001', plant:'กล้วย', formula:'F1 + Filter Lid', startDate:'2026-04-22', status:'Active', note:'ใบไม่ฉ่ำน้ำ ภาชนะไม่เกิดหยดน้ำมาก' }
  ],
  formulas: [
    { id:'F1', name:'F1 Banana Growth Medium', plant:'กล้วย', detail:'20-20-20+TE 2g, 15-0-0+27CaO 10ml, MgSO4 10ml, Sugar 30g, Agar 7g ต่อ 1L', note:'สูตรพื้นฐานสำหรับกล้วย' },
    { id:'F2', name:'F2 + BA/NAA Test', plant:'กล้วย / ไม้ด่าง', detail:'สูตร F1 + BA/NAA', note:'ใช้ทดสอบผลของฮอร์โมน' }
  ],
  costs: [
    { id:'C-001', item:'20-20-20+TE', price:35, volume:100, used:2, unit:'g', note:'ซื้อ 35 บาท ได้ 100 g / ใช้ 2 g/L' },
    { id:'C-002', item:'Sugar', price:30, volume:1000, used:30, unit:'g', note:'ซื้อ 30 บาท ได้ 1000 g / ใช้ 30 g/L' },
    { id:'C-003', item:'Agar', price:250, volume:100, used:7, unit:'g', note:'ซื้อ 250 บาท ได้ 100 g / ใช้ 7 g/L' }
  ]
};
let data = loadData();
let tab = 'dashboard';
function loadData(){ try{ return JSON.parse(localStorage.getItem(STORAGE_KEY)) || structuredClone(defaultData); } catch { return structuredClone(defaultData); } }
function saveData(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); }
function newId(prefix){ return `${prefix}-${Date.now().toString().slice(-6)}`; }
function money(v){ return Number(v||0).toLocaleString('th-TH',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function daysFrom(d){ const start = new Date(d); if(Number.isNaN(start.getTime())) return 0; return Math.max(0, Math.floor((Date.now()-start.getTime())/86400000)); }
function costPerUnit(row){ const p=Number(row.price||0), v=Number(row.volume||0); return v>0 ? p/v : 0; }
function usedCost(row){ return costPerUnit(row)*Number(row.used||0); }
function totalUsedCost(){ return data.costs.reduce((s,r)=>s+usedCost(r),0); }
function stats(){ const total=data.cultures.length; const contaminated=data.cultures.filter(c=>c.status==='Contamination').length; const active=data.cultures.filter(c=>['Active','Rooting','Running'].includes(c.status)).length; return {total, active, contaminated, survivalRate: total ? Math.round(active/total*100) : 0, contamRate: total ? Math.round(contaminated/total*100) : 0}; }
function esc(s){ return String(s ?? '').replace(/[&<>'"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c])); }
function setTab(t){ tab=t; render(); }
function update(collection,id,key,value){ const item=data[collection].find(x=>x.id===id); if(item){ item[key]=value; saveData(); render(); } }
function del(collection,id){ data[collection]=data[collection].filter(x=>x.id!==id); saveData(); render(); }
function statusOptions(value){ return STATUS_OPTIONS.map(s=>`<option ${s===value?'selected':''}>${s}</option>`).join(''); }
function unitOptions(value){ return UNIT_OPTIONS.map(s=>`<option value="${s}" ${s===value?'selected':''}>${s}</option>`).join(''); }
function badge(status){ const cls=status==='Contamination'?'badge-bad':status==='Closed'?'badge-neutral':'badge-ok'; return `<span class="badge ${cls}">${esc(status)}</span>`; }
function input(collection,id,key,value,type='text'){ return `<input type="${type}" value="${esc(value)}" onchange="update('${collection}','${id}','${key}', ${type==='number'?'Number(this.value)':'this.value'})">`; }
function textarea(collection,id,key,value){ return `<textarea onchange="update('${collection}','${id}','${key}',this.value)">${esc(value)}</textarea>`; }
function statusSelect(collection,id,value){ return `<select onchange="update('${collection}','${id}','status',this.value)">${statusOptions(value)}</select>`; }
function unitSelect(collection,id,value){ return `<select onchange="update('${collection}','${id}','unit',this.value)">${unitOptions(value)}</select>`; }
function card(title, sub='', body=''){ return `<div class="card"><div style="margin-bottom:14px"><h2>${title}</h2>${sub?`<p class="muted" style="margin:6px 0 0">${sub}</p>`:''}</div>${body}</div>`; }
function stat(label,value,sub){ return `<div class="card"><div class="stat-label">${label}</div><div class="stat-value">${value}</div><div class="stat-sub">${sub}</div></div>`; }
function table(cols, rows){ return `<div class="table-wrap"><table><thead><tr>${cols.map(c=>`<th>${c}</th>`).join('')}</tr></thead><tbody>${rows}</tbody></table></div>`; }
function renderNav(){ document.getElementById('nav').innerHTML = tabs.map(([key,label])=>`<button class="nav-btn ${tab===key?'active':''}" onclick="setTab('${key}')">${label}</button>`).join(''); }
function render(){ renderNav(); document.getElementById('app').innerHTML = renderTab(); }
function renderTab(){ if(tab==='dashboard') return renderDashboard(); if(tab==='projects') return renderProjects(); if(tab==='experiments') return renderExperiments(); if(tab==='cultures') return renderCultures(); if(tab==='formulas') return renderFormulas(); if(tab==='costs') return renderCosts(); return renderReports(); }
function renderDashboard(){ const s=stats(), tc=totalUsedCost(); return `<section class="section"><div class="grid">${stat('Projects',data.projects.length,'โปรเจกต์ทั้งหมด')}${stat('Experiments',data.experiments.length,'การทดลองทั้งหมด')}${stat('Cultures',s.total,'culture records')}${stat('Survival',s.survivalRate+'%','อัตรารอด')}${stat('Contamination',s.contamRate+'%','อัตราปนเปื้อน')}${stat('Cost / Liter',money(tc)+'฿','ต้นทุนต่อ 1 ลิตร')}</div><div class="grid">${card('Recent Projects','โปรเจกต์ล่าสุด', data.projects.slice(0,4).map(p=>`<div class="recent-item"><div style="display:flex;justify-content:space-between;gap:10px"><b>${esc(p.name)}</b>${badge(p.status)}</div><div class="muted" style="margin-top:4px">${esc(p.type)}</div></div>`).join(''))}${card('Recent Cultures','culture ล่าสุด', data.cultures.slice(0,4).map(c=>`<div class="recent-item"><div style="display:flex;justify-content:space-between;gap:10px"><b>${esc(c.id)}</b>${badge(c.status)}</div><div class="muted" style="margin-top:4px">${esc(c.plant)} • ${esc(c.formula)} • ${daysFrom(c.startDate)} วัน</div></div>`).join(''))}</div></section>`; }
function addProject(){ const name=document.getElementById('p_name').value.trim(); if(!name) return; data.projects.unshift({id:newId('P'),name,type:document.getElementById('p_type').value,status:document.getElementById('p_status').value,goal:document.getElementById('p_goal').value,note:''}); saveData(); render(); }
function renderProjects(){ const form=`<div class="grid"><input id="p_name" placeholder="ชื่อโปรเจกต์"><input id="p_type" placeholder="ประเภท"><select id="p_status">${statusOptions('Active')}</select><input id="p_goal" placeholder="เป้าหมาย"><button class="btn" onclick="addProject()">เพิ่มโปรเจกต์</button></div>`; const rows=data.projects.map(p=>`<tr><td>${esc(p.id)}</td><td>${input('projects',p.id,'name',p.name)}</td><td>${input('projects',p.id,'type',p.type)}</td><td>${statusSelect('projects',p.id,p.status)}</td><td>${input('projects',p.id,'goal',p.goal)}</td><td><button class="btn btn-danger" onclick="del('projects','${p.id}')">ลบ</button></td></tr>`).join(''); return `<section class="section">${card('Projects','สร้าง แก้ไข และลบโปรเจกต์วิจัย',form)}${table(['ID','Name','Type','Status','Goal','Actions'],rows)}</section>`; }
function addExperiment(){ const title=document.getElementById('e_title').value.trim(); if(!title) return; data.experiments.unshift({id:newId('EXP'),title,projectId:document.getElementById('e_project').value,plant:document.getElementById('e_plant').value,formula:document.getElementById('e_formula').value,startDate:document.getElementById('e_date').value,status:document.getElementById('e_status').value,objective:document.getElementById('e_objective').value,note:document.getElementById('e_note').value}); saveData(); render(); }
function renderExperiments(){ const projectOpts=data.projects.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join(''); const today=new Date().toISOString().slice(0,10); const form=`<div class="grid"><input id="e_title" placeholder="ชื่อการทดลอง"><select id="e_project">${projectOpts}</select><input id="e_plant" placeholder="ชนิดพืช"><input id="e_formula" placeholder="สูตรอาหาร"><input id="e_date" type="date" value="${today}"><select id="e_status">${statusOptions('Running')}</select></div><div class="space-top"><textarea id="e_objective" placeholder="วัตถุประสงค์"></textarea></div><div class="space-top"><textarea id="e_note" placeholder="หมายเหตุ"></textarea></div><div class="space-top"><button class="btn" onclick="addExperiment()">เพิ่มการทดลอง</button></div>`; const rows=data.experiments.map(e=>`<tr><td>${esc(e.id)}</td><td>${input('experiments',e.id,'title',e.title)}</td><td>${input('experiments',e.id,'plant',e.plant)}</td><td>${input('experiments',e.id,'formula',e.formula)}</td><td>${daysFrom(e.startDate)} วัน</td><td>${statusSelect('experiments',e.id,e.status)}</td><td>${input('experiments',e.id,'note',e.note)}</td><td><button class="btn btn-danger" onclick="del('experiments','${e.id}')">ลบ</button></td></tr>`).join(''); return `<section class="section">${card('Experiments','บันทึกการทดลองปกติ',form)}${table(['ID','Title','Plant','Formula','Age','Status','Note','Actions'],rows)}</section>`; }
function addCulture(){ const plant=document.getElementById('c_plant').value.trim(); if(!plant) return; data.cultures.unshift({id:newId('CUL'),experimentId:document.getElementById('c_exp').value,plant,formula:document.getElementById('c_formula').value,startDate:document.getElementById('c_date').value,status:document.getElementById('c_status').value,note:document.getElementById('c_note').value}); saveData(); render(); }
function renderCultures(){ const expOpts='<option value="">เลือกการทดลอง</option>'+data.experiments.map(e=>`<option value="${e.id}">${esc(e.title)}</option>`).join(''); const today=new Date().toISOString().slice(0,10); const form=`<div class="grid"><select id="c_exp">${expOpts}</select><input id="c_plant" placeholder="ชนิดพืช"><input id="c_formula" placeholder="สูตรอาหาร"><input id="c_date" type="date" value="${today}"><select id="c_status">${statusOptions('Active')}</select><button class="btn" onclick="addCulture()">เพิ่ม Culture</button></div><div class="space-top"><textarea id="c_note" placeholder="หมายเหตุ"></textarea></div>`; const rows=data.cultures.map(c=>`<tr><td>${esc(c.id)}</td><td>${input('cultures',c.id,'plant',c.plant)}</td><td>${input('cultures',c.id,'formula',c.formula)}</td><td>${daysFrom(c.startDate)} วัน</td><td>${statusSelect('cultures',c.id,c.status)}</td><td>${input('cultures',c.id,'note',c.note)}</td><td><button class="btn btn-danger" onclick="del('cultures','${c.id}')">ลบ</button></td></tr>`).join(''); return `<section class="section">${card('Culture Records','บันทึก culture แต่ละขวด/ถุง',form)}${table(['ID','Plant','Formula','Age','Status','Note','Actions'],rows)}</section>`; }
function addFormula(){ const name=document.getElementById('f_name').value.trim(); if(!name) return; data.formulas.unshift({id:newId('F'),name,plant:document.getElementById('f_plant').value,detail:document.getElementById('f_detail').value,note:document.getElementById('f_note').value}); saveData(); render(); }
function renderFormulas(){ const form=`<div class="grid"><input id="f_name" placeholder="ชื่อสูตร"><input id="f_plant" placeholder="พืชที่ใช้"><button class="btn" onclick="addFormula()">เพิ่มสูตร</button></div><div class="space-top"><textarea id="f_detail" placeholder="รายละเอียดสูตร"></textarea></div><div class="space-top"><textarea id="f_note" placeholder="หมายเหตุ"></textarea></div>`; const rows=data.formulas.map(f=>`<tr><td>${esc(f.id)}</td><td>${input('formulas',f.id,'name',f.name)}</td><td>${input('formulas',f.id,'plant',f.plant)}</td><td>${textarea('formulas',f.id,'detail',f.detail)}</td><td>${input('formulas',f.id,'note',f.note)}</td><td><button class="btn btn-danger" onclick="del('formulas','${f.id}')">ลบ</button></td></tr>`).join(''); return `<section class="section">${card('Formulas','บันทึกสูตรอาหาร',form)}${table(['ID','Name','Plant','Detail','Note','Actions'],rows)}</section>`; }
function addCost(){ const item=document.getElementById('cost_item').value.trim(); if(!item) return; data.costs.unshift({id:newId('C'),item,price:Number(document.getElementById('cost_price').value||0),volume:Number(document.getElementById('cost_volume').value||0),used:Number(document.getElementById('cost_used').value||0),unit:document.getElementById('cost_unit').value,note:document.getElementById('cost_note').value}); saveData(); render(); }
function renderCosts(){ const form=`<div class="grid"><div><label>รายการ</label><input id="cost_item" placeholder="เช่น Agar, Sugar, 20-20-20+TE"></div><div><label>ราคา (บาท)</label><input id="cost_price" type="number" value="0"></div><div><label>ปริมาตร</label><input id="cost_volume" type="number" value="0"></div><div><label>ปริมาณที่ใช้ต่อลิตร</label><input id="cost_used" type="number" value="0" placeholder="เช่น 2 = 2 g/L หรือ 2 ml/L"></div><div><label>หน่วย</label><select id="cost_unit">${unitOptions('g')}</select></div><button class="btn" onclick="addCost()">เพิ่มต้นทุน</button></div><div class="space-top"><textarea id="cost_note" placeholder="หมายเหตุ"></textarea></div>`; const rows=data.costs.map(r=>`<tr><td>${esc(r.id)}</td><td>${input('costs',r.id,'item',r.item)}</td><td>${input('costs',r.id,'price',r.price,'number')} บาท</td><td>${input('costs',r.id,'volume',r.volume,'number')}</td><td>${input('costs',r.id,'used',r.used??0,'number')}</td><td>${unitSelect('costs',r.id,r.unit)}</td><td>${money(costPerUnit(r))} บาท/${esc(r.unit)}</td><td><b>${money(usedCost(r))}</b> บาท/L</td><td>${input('costs',r.id,'note',r.note)}</td><td><button class="btn btn-danger" onclick="del('costs','${r.id}')">ลบ</button></td></tr>`).join(''); return `<section class="section">${card('Cost Analysis','กำหนดปริมาณที่ใช้ทุกอย่างเป็นหน่วยต่อลิตร เช่น g/L หรือ ml/L แล้วระบบคำนวณต้นทุนต่อ 1 ลิตรให้',form)}<div class="card"><b>ต้นทุนรวมต่อ 1 ลิตร: ${money(totalUsedCost())} บาท/L</b></div>${table(['ID','รายการ','ราคา','ปริมาตรที่ซื้อ','ใช้ต่อลิตร','หน่วย','ราคา/หน่วย','ต้นทุน/ลิตร','หมายเหตุ','Actions'],rows)}</section>`; }
function renderReports(){ const s=stats(); return `<section class="section"><div class="card"><div style="margin-bottom:14px"><h2>Reports</h2><p class="muted" style="margin:6px 0 0">สรุปรายงานแบบเรียบง่าย</p></div><div class="grid">${stat('Projects',data.projects.length,'ทั้งหมด')}${stat('Experiments',data.experiments.length,'ทั้งหมด')}${stat('Cultures',data.cultures.length,'ทั้งหมด')}${stat('Survival',s.survivalRate+'%','อัตรารอด')}${stat('Cost / Liter',money(totalUsedCost())+'฿','ต้นทุนต่อ 1 ลิตร')}</div><div style="margin-top:14px"><button class="btn" onclick="exportReport()">ดาวน์โหลดรายงาน TXT</button></div></div></section>`; }
function exportReport(){ const s=stats(); const report=['Tissue Research Report','',`Projects: ${data.projects.length}`,`Experiments: ${data.experiments.length}`,`Cultures: ${s.total}`,`Survival Rate: ${s.survivalRate}%`,`Contamination Rate: ${s.contamRate}%`,`Cost per 1 Liter: ${money(totalUsedCost())} THB`].join('\n'); const blob=new Blob([report],{type:'text/plain;charset=utf-8'}); const url=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=url; a.download='tissue-research-report.txt'; a.click(); URL.revokeObjectURL(url); }
render();
</script>
</body>
</html>
